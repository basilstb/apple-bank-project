databases:
  - name: apple-bank-db
    databaseName: apple_bank
    user: apple_bank_user
    plan: free

services:
  - type: web
    name: apple-bank-web
    env: python
    plan: free
    buildCommand: "bash build.sh"
    startCommand: "gunicorn apple_bank.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apple-bank-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
      # Email settings — sync: false keeps Render from overwriting your manual values
      - key: EMAIL_BACKEND
        sync: false
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_PORT
        sync: false
      - key: EMAIL_USE_TLS
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
      - key: SITE_URL
        sync: false
      # Cloudinary — sync: false stops this from being wiped on deploys
      - key: CLOUDINARY_URL
        sync: false
