databases:
  - name: apple-bank-db
    databaseName: apple_bank
    user: apple_bank_user
    plan: free

services:
  - type: web
    name: apple-bank-web
    env: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn apple_bank.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: apple-bank-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: WEB_CONCURRENCY
        value: 4
      - key: DEBUG
        value: "False"
      - key: ALLOWED_HOSTS
        value: "*"
