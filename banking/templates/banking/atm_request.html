{% extends 'base.html' %}

{% block title %}Request ATM Card - Apple Bank{% endblock %}

{% block content %}
<div class="max-w-2xl mx-auto">
    <div class="bg-white rounded-2xl shadow-sm border border-gray-100 p-6 sm:p-8">
        <div class="flex items-center space-x-4 mb-8">
            <div class="bg-orange-50 p-3 rounded-full text-orange-600">
                <svg class="w-8 h-8" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M3 10h18M7 15h1m4 0h1m-7 4h12a3 3 0 003-3V8a3 3 0 00-3-3H6a3 3 0 00-3 3v8a3 3 0 003 3z">
                    </path>
                </svg>
            </div>
            <div>
                <h2 class="text-2xl font-bold text-gray-900">Request ATM Card</h2>
                <p class="text-gray-500">Order a new physical or virtual debit card.</p>
            </div>
        </div>

        <form method="POST" class="space-y-6">
            {% csrf_token %}

            <div>
                <label for="id_card_type" class="block text-sm font-medium text-gray-700 mb-1">Card Type</label>
                {{ form.card_type }}
                {% if form.card_type.errors %}
                <p class="text-red-500 text-xs mt-1">{{ form.card_type.errors.0 }}</p>
                {% endif %}
            </div>

            <div class="pt-4">
                <button type="submit"
                    class="w-full flex justify-center py-3 px-4 border border-transparent rounded-full shadow-sm text-sm font-medium text-white bg-apple-dark hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-apple-dark transition-colors">
                    Submit Request
                </button>
            </div>
        </form>
    </div>
</div>
{% endblock %}
